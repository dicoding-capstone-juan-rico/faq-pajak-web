services:
  web:
    build: .
    container_name: capstone_web_faq_pajak
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AI_API_URL=${AI_API_URL}
    volumes:
      - .:/app
      - /app/node_modules
      # untuk lokal saja, agar timezone di container sama dengan host
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - db
      - socket

  socket:
    build: .
    container_name: capstone_socket_server
    command: npm run socket
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AI_API_URL=${AI_API_URL}
    volumes:
      - .:/app
      - /app/node_modules
      # untuk lokal saja, agar timezone di container sama dengan host
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - db

  db:
    image: postgres:18.3-alpine
    container_name: capstone_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: capstone_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_capstone:/var/lib/postgresql/data
      # untuk lokal saja, agar timezone di container sama dengan host
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

volumes:
  postgres_data_capstone: