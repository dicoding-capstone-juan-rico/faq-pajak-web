services:
  web:
    build: .
    container_name: capstone_web_faq_pajak
    ports:
      - "4000:3000" 
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AI_API_URL=${AI_API_URL}
    # Volumes lokal (- .:/app) 
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      # - db
      - socket

  socket:
    build: .
    container_name: capstone_socket_server
    command: npm run socket
    ports:
      - "4001:4001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AI_API_URL=${AI_API_URL}
    # Volumes lokal (- .:/app)
